<script>

//  IMAGES
// ═══════════════════════════════════════════════════════

function imgOk(img){ return img.complete&&img.naturalWidth>0&&!img._failed; }

// ═══════════════════════════════════════════════════════
//  SPEECH
// ═══════════════════════════════════════════════════════
const Speech=(() => {
  const synth=window.speechSynthesis;
  let voices=[],rexVoice=null,narratorVoice=null,bookVoice=null,ready=false;

  // British-biased voice profiles - increasingly unhinged pitch/rate per level
  let insanityLevel=0; // increases with level
  function profile(base){
    const chaos=insanityLevel*0.08;
    return{rate:base.rate+(Math.random()*chaos-chaos/2),pitch:base.pitch+(Math.random()*chaos*2-chaos),volume:1.0};
  }
  const baseProfiles={
    rex:        {rate:0.70,pitch:0.50},
    narrator:   {rate:0.94,pitch:1.02},
    book_red:   {rate:1.08,pitch:0.82},
    book_blue:  {rate:1.30,pitch:1.70},
    book_green: {rate:0.88,pitch:0.98},
    book_yellow:{rate:1.12,pitch:1.45},
  };

  function loadVoices(){
    voices=synth.getVoices();
    if(!voices.length)return;

    // Prefer en-GB voices (true British TTS)
    const brit=voices.filter(v=>/en-GB/i.test(v.lang));
    const en=voices.filter(v=>v.lang.startsWith('en'));
    const pool=brit.length?brit:(en.length?en:voices);

    // Pick distinctly different voices where possible
    // Male-sounding: Daniel (en-GB), David, Google UK English Male
    rexVoice=pool.find(v=>/Daniel|David|Google UK English Male|Oliver|Arthur|en-GB.*male/i.test(v.name))
      ||brit.find(v=>v.name.toLowerCase().includes('male'))
      ||pool[0];

    // Female-sounding: Kate, Serena, Google UK English Female, Moira
    narratorVoice=pool.find(v=>/Kate|Serena|Google UK English Female|Moira|Fiona|Amy|Victoria|en-GB.*female/i.test(v.name))
      ||brit.find(v=>v!==rexVoice)
      ||pool.find(v=>v!==rexVoice)
      ||pool[0];

    // Third voice for books — any remaining en-GB, else fall back
    bookVoice=brit.find(v=>v!==rexVoice&&v!==narratorVoice)
      ||pool.find(v=>v!==rexVoice&&v!==narratorVoice)
      ||narratorVoice;

    ready=true;
    console.log('Voices loaded — Rex:',rexVoice?.name,'Narrator:',narratorVoice?.name,'Book:',bookVoice?.name);
  }
  synth.onvoiceschanged=loadVoices;
  loadVoices();setTimeout(loadVoices,500);

  let currentUtter=null;

  function speak(text,speaker,onEnd,onWord){
    if(!synth){onEnd&&onEnd();return;}
    synth.cancel();
    const utter=new SpeechSynthesisUtterance(text);
    const p=profile(baseProfiles[speaker]||baseProfiles.narrator);
    utter.rate=Math.max(0.5,Math.min(2,p.rate));
    utter.pitch=Math.max(0.1,Math.min(2,p.pitch));
    utter.volume=p.volume;
    if(speaker==='rex')utter.voice=rexVoice;
    else if(speaker==='narrator')utter.voice=narratorVoice;
    else utter.voice=bookVoice;
    utter.onboundary=e=>{if(e.name==='word'&&onWord)onWord(e.charIndex,e.charLength,text.slice(e.charIndex,e.charIndex+e.charLength));};
    utter.onend=()=>{currentUtter=null;onEnd&&onEnd();};
    utter.onerror=()=>{currentUtter=null;onEnd&&onEnd();};
    currentUtter=utter;
    synth.speak(utter);
  }

  function cancel(){synth&&synth.cancel();currentUtter=null;}
  function setInsanity(l){insanityLevel=l;}

  return{speak,cancel,isReady:()=>ready,setInsanity};
})();

// ═══════════════════════════════════════════════════════
//  SFX
// ═══════════════════════════════════════════════════════
const SFX=(() => {
  let ctx=null;
  function getCtx(){
    if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  function tone(freq,type,dur,vol,attack=0.01,release=0.05){
    const ac=getCtx(),osc=ac.createOscillator(),gain=ac.createGain();
    osc.connect(gain);gain.connect(ac.destination);
    osc.type=type;osc.frequency.setValueAtTime(freq,ac.currentTime);
    gain.gain.setValueAtTime(0,ac.currentTime);
    gain.gain.linearRampToValueAtTime(vol,ac.currentTime+attack);
    gain.gain.linearRampToValueAtTime(0,ac.currentTime+dur+release);
    osc.start();osc.stop(ac.currentTime+dur+release+0.05);
  }
  function sweep(f1,f2,type,dur,vol){
    const ac=getCtx(),osc=ac.createOscillator(),gain=ac.createGain();
    osc.connect(gain);gain.connect(ac.destination);
    osc.type=type;
    osc.frequency.setValueAtTime(f1,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+dur);
    gain.gain.setValueAtTime(vol,ac.currentTime);
    gain.gain.linearRampToValueAtTime(0,ac.currentTime+dur);
    osc.start();osc.stop(ac.currentTime+dur+0.05);
  }
  function noise(dur,vol,hp=200){
    const ac=getCtx(),buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=ac.createBufferSource();src.buffer=buf;
    const flt=ac.createBiquadFilter();flt.type='highpass';flt.frequency.value=hp;
    const g=ac.createGain();g.gain.setValueAtTime(vol,ac.currentTime);g.gain.linearRampToValueAtTime(0,ac.currentTime+dur);
    src.connect(flt);flt.connect(g);g.connect(ac.destination);
    src.start();src.stop(ac.currentTime+dur+0.05);
  }
  return{
    chomp(){tone(480,'square',0.04,0.15,0.005,0.02);setTimeout(()=>tone(360,'square',0.04,0.1,0.005,0.02),45);},
    powerUp(){[0,80,160,240,320].forEach((d,i)=>setTimeout(()=>{const f=280*Math.pow(1.3,i);sweep(f,f*1.6,'sine',0.2,0.22);},d));setTimeout(()=>noise(0.3,0.07,800),200);},
    capture(){[0,60,120,200].forEach((d,i)=>setTimeout(()=>tone(330*Math.pow(1.2,i),'sine',0.12,0.18,0.01,0.06),d));},
    drag(){tone(440,'triangle',0.06,0.08,0.005,0.04);},
    pellet(){tone(500,'sine',0.03,0.06,0.005,0.02);},
    death(){sweep(440,60,'sawtooth',0.6,0.28);setTimeout(()=>sweep(300,50,'square',0.4,0.18),200);setTimeout(()=>noise(0.3,0.14,100),400);},
    levelUp(){const notes=[262,330,392,523,659,784,1047];notes.forEach((f,i)=>setTimeout(()=>tone(f,'square',0.12,0.2,0.01,0.05),i*85));},
    warning(){tone(880,'sine',0.06,0.07,0.005,0.04);},
    start(){setTimeout(()=>tone(330,'triangle',0.1,0.14,0.01,0.05),0);setTimeout(()=>tone(392,'triangle',0.1,0.14,0.01,0.05),120);setTimeout(()=>tone(523,'triangle',0.15,0.18,0.01,0.1),240);}
  };
})();

const SPEAKER_CLASS={rex:'speaker-rex',narrator:'speaker-narrator',book_red:'speaker-book_red',book_blue:'speaker-book_blue',book_green:'speaker-book_green',book_yellow:'speaker-book_yellow'};
const SPEAKER_LABEL={rex:'🦕 REX',narrator:'🎙 NARRATOR',book_red:'📕 RED BOOK',book_blue:'📘 BLUE BOOK',book_green:'📗 GREEN BOOK',book_yellow:'📒 YELLOW BOOK'};

let speechQueue=[],isSpeaking=false,dlgCooldown=0,currentLineTimeout=null,gagIdx=0;
let lastIdlePool=null;

function getIdlePool(lv){
  if(lv>=4)return DIALOGUES.idle_level4plus;
  if(lv>=3)return DIALOGUES.idle_level3;
  if(lv>=2)return DIALOGUES.idle_level2;
  return DIALOGUES.idle_level1;
}

function queueDialogue(type,immediate=false){
  let scene=[];
  if(type==='idle'){
    // 25% chance running gag
    if(Math.random()<0.25&&gagIdx<DIALOGUES.gag_lost_page.length){
      scene=DIALOGUES.gag_lost_page[gagIdx++];
    } else {
      const pool=getIdlePool(level||1);
      scene=pool[Math.floor(Math.random()*pool.length)];
    }
  } else {
    const pool=DIALOGUES[type];
    if(!pool)return;
    scene=pool[Math.floor(Math.random()*pool.length)];
  }
  if(immediate){speechQueue=[...scene];startNextLine();}
  else{speechQueue.push(...scene);if(!isSpeaking)startNextLine();}
}

function startNextLine(){
  if(!speechQueue.length){isSpeaking=false;return;}
  isSpeaking=true;
  const line=speechQueue.shift();
  renderDialogue(line);
  Speech.speak(line.text,line.speaker,
    ()=>{currentLineTimeout=setTimeout(()=>{if(speechQueue.length)startNextLine();else{isSpeaking=false;scheduleHide();}},300);},
    (ci,cl)=>highlightWord(line.text,ci,cl)
  );
}

function renderDialogue(line){
  document.getElementById('dialogue-avatar').textContent=line.avatar||'🎙';
  const spk=document.getElementById('dialogue-speaker');
  spk.textContent=SPEAKER_LABEL[line.speaker]||line.speaker;
  spk.className=SPEAKER_CLASS[line.speaker]||'';
  setDlgText(line.text,-1,-1);
  document.getElementById('dialogue-wrap').classList.add('show');
}
function setDlgText(text,ci,cl){
  const el=document.getElementById('dialogue-text');
  if(ci<0||cl<=0){el.textContent=text;return;}
  el.innerHTML=escH(text.slice(0,ci))+'<span class="word-highlight">'+escH(text.slice(ci,ci+cl))+'</span>'+escH(text.slice(ci+cl));
}
function escH(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function highlightWord(text,ci,cl){setDlgText(text,ci,cl);}
let hideTimer=null;
function scheduleHide(){if(hideTimer)clearTimeout(hideTimer);hideTimer=setTimeout(()=>document.getElementById('dialogue-wrap').classList.remove('show'),2000);}
function hideDialogue(){Speech.cancel();speechQueue=[];isSpeaking=false;if(currentLineTimeout)clearTimeout(currentLineTimeout);if(hideTimer)clearTimeout(hideTimer);document.getElementById('dialogue-wrap').classList.remove('show');}

let maze,pellets,score,lives,level,gameState;
let dX,dY,dDir,dNext,jawOpen;
let books=[];
let pwrTimer=0,pwrMax=300,animF=0,lastT=0;
let warningPlayed=false;
let booksCaptured=0;
let dragging=null; // the book being dragged, or null
let dragMoveTimer=0; // small sound timer

const BOOK_COLORS=['#ff4040','#44aaff','#ffbb33','#55dd66'];
const BOOK_LABELS=['RED','BLUE','YELLOW','GREEN'];
const BOOK_SPEAKERS=['book_red','book_blue','book_yellow','book_green'];
const SCATTER_TARGETS=[[1,1],[17,1],[1,19],[17,19]];

const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
function initGame(){
  score=0;lives=3;level=1;gameState='playing';
  jawOpen=true;pwrTimer=0;dlgCooldown=0;warningPlayed=false;
  booksCaptured=0;dragging=null;gagIdx=0;
  Speech.setInsanity(0);
  hideDialogue();
  initLevel();updateHUD();
}

function initLevel(){
  maze=MAZE_TPL.map(r=>[...r]);
  pellets=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(maze[r][c]===2||maze[r][c]===3)pellets++;
  dX=9;dY=16;dDir='left';dNext='left';
  dragging=null;
  // Books release from pen one by one; timer in frames. Each level shaves 20 frames off.
  const baseRelease=[180,300,420,540];
  books=BOOK_COLORS.map((col,i)=>({
    x:9,y:9,
    dir:'up',
    color:col,
    mode:'scatter',modeT:200+i*60,
    scared:false,
    captured:false,
    released:false,
    releaseTimer:Math.max(60,baseRelease[i]-(level-1)*20),
    imgIdx:0,
    scatterTarget:SCATTER_TARGETS[i],
    label:BOOK_LABELS[i],
    speaker:BOOK_SPEAKERS[i],
    id:i,
  }));
  booksCaptured=0;
  pwrMax=Math.max(180,300-level*20);
}

function passable(c,r){
  if(c<0||c>=COLS||r<0||r>=ROWS)return true;
  return maze[r][c]!==1;
}
function wrap(c,r){
  if(c<0)c=COLS-1;if(c>=COLS)c=0;
  if(r<0)r=ROWS-1;if(r>=ROWS)r=0;
  return[c,r];
}

// ═══════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════
let dMoveT=0,bMoveT=0;
const DSPD_NORMAL=8,DSPD_DRAG=11; // slower while dragging
function bSpd(){return Math.max(10-level,5);}

function update(dt){
  if(gameState!=='playing')return;
  animF++;

  if(dlgCooldown>0)dlgCooldown--;

  // Near-continuous dialogue: very short cooldown, high probability
  if(!isSpeaking&&dlgCooldown===0&&animF>120&&Math.random()<0.004){
    queueDialogue('idle');
    dlgCooldown=Math.floor(180+Math.random()*120); // ~3-5 sec between idle scenes
  }

  // Jaw animation
  if(animF%4===0)jawOpen=!jawOpen;

  // Warning if non-scared book is close
  const minDist=Math.min(...books.filter(b=>!b.scared&&!b.captured&&b.released).map(b=>Math.abs(b.x-dX)+Math.abs(b.y-dY)).concat([Infinity]));
  if(minDist<=2&&!warningPlayed){SFX.warning();warningPlayed=true;}
  if(minDist>3)warningPlayed=false;

  // Booster ticks down
  if(pwrTimer>0){
    pwrTimer--;
    if(pwrTimer===0){
      books.forEach(b=>{if(!b.captured&&b.released)b.scared=false;});
      // If dragging, drop the book
      if(dragging){
        dragging.scared=false;
        dragging=null;
        // brief dialogue
        queueDialogue('death',true);
        dlgCooldown=200;
      }
    }
  }

  // Dino movement
  const dspd=dragging?DSPD_DRAG:DSPD_NORMAL;
  dMoveT++;
  if(dMoveT>=dspd){
    dMoveT=0;
    const[dx,dy]=DIRS[dNext];
    let[nx,ny]=wrap(dX+dx,dY+dy);
    let moved=false;
    if(passable(nx,ny)&&maze[ny][nx]!==4){
      dDir=dNext;dX=nx;dY=ny;moved=true;
    } else {
      const[dx2,dy2]=DIRS[dDir];
      let[nx2,ny2]=wrap(dX+dx2,dY+dy2);
      if(passable(nx2,ny2)&&maze[ny2][nx2]!==4){dX=nx2;dY=ny2;moved=true;}
    }

    // Pellet eating
    const t=maze[dY][dX];
    if(t===2){
      maze[dY][dX]=0;score+=10;pellets--;updateHUD();
      SFX.chomp();
      // Pellets extend booster timer
      if(pwrTimer>0){pwrTimer=Math.min(pwrTimer+40,pwrMax);books.forEach(b=>{if(!b.captured&&b.released)b.scared=true;});}
    }
    if(t===3){
      maze[dY][dX]=0;score+=50;pellets--;
      pwrTimer=pwrMax;
      books.forEach(b=>{if(!b.captured&&b.released)b.scared=true;});
      updateHUD();
      SFX.powerUp();
      speechQueue=[];
      queueDialogue('power',true);
      dlgCooldown=200;
    }

    // If dragging, move book with dino
    if(dragging&&moved){
      dragging.x=dX;dragging.y=dY;
      dragMoveTimer++;
      if(dragMoveTimer%6===0)SFX.drag();

      // Pen entrance: col 8 row 7 and col 10 row 7 are the two reachable tiles above the pen
      // (col 9 row 7 is a wall — dino cannot be there)
      if((dX===8||dX===10)&&dY===7){
        captureBook(dragging);
      }
    }
  }

  // Release timers — count down and eject book from pen when ready
  books.forEach(b=>{
    if(b.captured||b.released)return;
    b.releaseTimer--;
    if(b.releaseTimer<=0){
      b.released=true;
      // Alternate between the two pen entrance tiles (8,7) and (10,7)
      b.x=(b.id%2===0)?8:10;b.y=7;b.dir='up';
    }
  });

  // Books move
  bMoveT++;
  if(bMoveT>=bSpd()){
    bMoveT=0;
    books.forEach(b=>{if(!b.captured&&b.released&&b!==dragging)moveBook(b);});
  }

  // Collision: dino touches a book
  books.forEach(b=>{
    if(b.captured||b===dragging||!b.released)return;
    if(Math.abs(b.x-dX)<1&&Math.abs(b.y-dY)<1){
      if(b.scared&&pwrTimer>0){
        // Grab the book — snap to dino position immediately
        dragging=b;
        dragging.x=dX;dragging.y=dY;
        speechQueue=[];
        queueDialogue('drag',true);
        dlgCooldown=200;
        SFX.drag();
      } else if(!b.scared){
        SFX.death();
        if(dragging)dragging=null;
        speechQueue=[];
        queueDialogue('death',true);
        dlgCooldown=200;
        loseLife();
      }
    }
  });

  // Level win: all books captured
  if(booksCaptured>=4){
    level++;
    Speech.setInsanity(Math.min(level-1,5));
    SFX.levelUp();
    speechQueue=[];
    queueDialogue('levelUp',true);
    dlgCooldown=300;
    initLevel();updateHUD();
  }
}

function captureBook(b){
  b.captured=true;
  b.x=PEN_CENTRE.x;b.y=PEN_CENTRE.y;
  b.scared=false;
  dragging=null;
  booksCaptured++;
  score+=500;
  updateHUD();
  SFX.capture();
  speechQueue=[];
  queueDialogue('capture',true);
  dlgCooldown=200;
}

function loseLife(){
  lives--;updateHUD();
  if(lives<=0){gameState='dead';setTimeout(()=>showOverlay('GAME OVER',score),1500);}
  else{
    dX=9;dY=16;pwrTimer=0;dragging=null;
    books.forEach((b,i)=>{
      if(b.captured)return;
      b.scared=false;
      if(b.released){
        // Send to scatter corner so they don't cluster on respawn
        const t=b.scatterTarget;
        b.x=t[0];b.y=t[1];
        // Brief grace: delay chase mode
        b.mode='scatter';b.modeT=180;
      }
    });
  }
}

function moveBook(b){
  b.modeT--;
  if(b.modeT<=0){b.mode=b.mode==='chase'?'scatter':'chase';b.modeT=b.mode==='chase'?220:140;}
  const dirs=Object.entries(DIRS);

  if(b.scared){
    // Flee from dino
    const valid=dirs.filter(([d,[dx,dy]])=>{
      if(d===OPP[b.dir])return false;
      const[nx,ny]=wrap(b.x+dx,b.y+dy);
      return passable(nx,ny)&&maze[ny][nx]!==4;
    });
    if(valid.length){const[nd,[dx,dy]]=valid[Math.floor(Math.random()*valid.length)];b.dir=nd;[b.x,b.y]=wrap(b.x+dx,b.y+dy);}
    return;
  }

  // Chase or scatter
  const tgt=b.mode==='chase'?[dX,dY]:b.scatterTarget;
  let best=Infinity,bestD=null;
  dirs.forEach(([d,[dx,dy]])=>{
    if(d===OPP[b.dir])return;
    const[nx,ny]=wrap(b.x+dx,b.y+dy);
    if(!passable(nx,ny)||maze[ny][nx]===4)return;
    const dist=(nx-tgt[0])**2+(ny-tgt[1])**2;
    if(dist<best){best=dist;bestD=d;}
  });
  if(bestD){const[dx,dy]=DIRS[bestD];b.dir=bestD;[b.x,b.y]=wrap(b.x+dx,b.y+dy);}
}

function draw(){
  ctx.fillStyle='#08040c';ctx.fillRect(0,0,CW,CH);
  drawMaze();
  drawPellets();
  drawPowerTimer();
  books.forEach(drawBook);
  drawDino();
  drawDragLine();
}

function drawMaze(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(maze[r][c]===1){
      const x=c*TILE,y=r*TILE;
      ctx.fillStyle='#160a2a';ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='#1c0e34';ctx.fillRect(x+1,y+1,TILE-2,TILE-2);
      ctx.strokeStyle='#4a20a0';ctx.lineWidth=0.8;ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
      // shelf lines
      ctx.strokeStyle='rgba(74,32,160,0.25)';ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(x+2,y+TILE*0.55);ctx.lineTo(x+TILE-2,y+TILE*0.55);ctx.stroke();
    }
    // Pen tiles — very subtle tint
    if(MAZE_TPL[r][c]===4){
      const x=c*TILE,y=r*TILE;
      ctx.fillStyle='rgba(60,15,90,0.12)';ctx.fillRect(x,y,TILE,TILE);
    }
  }
  // Pen border glow
  const px=PEN_RECT.x1*TILE,py=PEN_RECT.y1*TILE;
  const pw=(PEN_RECT.x2-PEN_RECT.x1+1)*TILE,ph=(PEN_RECT.y2-PEN_RECT.y1+1)*TILE;
  ctx.strokeStyle='rgba(120,50,200,0.3)';ctx.lineWidth=1;
  ctx.strokeRect(px,py,pw,ph);
  // Pen entrance markers — pulsing arrows at (8,7) and (10,7)
  const pulse=0.5+0.5*Math.sin(animF*0.12);
  [[8,7],[10,7]].forEach(([ec,er])=>{
    const ex=ec*TILE+TILE/2,ey=er*TILE+TILE/2;
    ctx.save();
    ctx.globalAlpha=0.35+0.35*pulse;
    ctx.fillStyle='#cc88ff';
    ctx.font='bold 9px Courier New';ctx.textAlign='center';
    ctx.fillText('▼',ex,ey+3);
    ctx.restore();
  });
}

function drawPellets(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=maze[r][c];
    const cx=c*TILE+TILE/2,cy=r*TILE+TILE/2;
    if(t===2){
      ctx.save();
      ctx.shadowColor='#ffcc33';ctx.shadowBlur=6;
      ctx.fillStyle='#ffe890';
      ctx.beginPath();ctx.arc(cx,cy,2.5,0,Math.PI*2);ctx.fill();
      ctx.restore();
    } else if(t===3){
      const p=0.7+0.3*Math.sin(animF*0.12);
      ctx.save();
      ctx.shadowColor='#ff44ff';ctx.shadowBlur=16;
      ctx.fillStyle='#ff88ff';
      ctx.beginPath();ctx.arc(cx,cy,6*p,0,Math.PI*2);ctx.fill();
      ctx.restore();
      ctx.fillStyle='rgba(255,200,255,0.7)';ctx.font='bold 7px Courier New';ctx.textAlign='center';
      ctx.fillText('+',cx,cy+2.5);ctx.textAlign='left';
    }
  }
}

function drawPowerTimer(){
  if(pwrTimer<=0)return;
  const frac=pwrTimer/pwrMax;
  const barW=CW-12,barH=5,barX=6,barY=CH-7;

  // Background
  ctx.fillStyle='rgba(40,15,70,0.7)';ctx.fillRect(barX,barY,barW,barH);
  // Fill
  const col=frac>0.4?'#aa44ff':(frac>0.2?'#ff88ff':'#ff4444');
  ctx.fillStyle=col;ctx.fillRect(barX,barY,barW*frac,barH);
  // Flicker when low
  if(frac<0.2&&Math.floor(animF/6)%2===0){
    ctx.fillStyle='rgba(255,200,100,0.3)';ctx.fillRect(barX,barY,barW*frac,barH);
  }
  // Border
  ctx.strokeStyle='rgba(180,100,255,0.5)';ctx.lineWidth=0.8;ctx.strokeRect(barX,barY,barW,barH);

  // Countdown text (seconds)
  const secs=Math.ceil(pwrTimer/60);
  ctx.fillStyle='rgba(255,200,255,0.85)';ctx.font='bold 8px Courier New';ctx.textAlign='center';
  ctx.fillText('BOOSTER: '+secs+'s',CW/2,barY-2);ctx.textAlign='left';
}

function drawDino(){
  const cx=dX*TILE+TILE/2,cy=dY*TILE+TILE/2;
  const S=TILE*1.8;
  ctx.save();ctx.translate(cx,cy);
  if(dDir==='left')ctx.scale(-1,1);
  else if(dDir==='up')ctx.rotate(-Math.PI/2);
  else if(dDir==='down')ctx.rotate(Math.PI/2);

  const sprite=jawOpen?DINO_OPEN:DINO_CLOSED;
  if(imgOk(sprite)){
    ctx.drawImage(sprite,-S/2,-S/2,S,S);
    // Tint green when dragging
    if(dragging){
      ctx.globalCompositeOperation='multiply';
      ctx.fillStyle='rgba(150,255,80,0.35)';
      ctx.fillRect(-S/2,-S/2,S,S);
      ctx.globalCompositeOperation='source-over';
    }
  } else {
    // Canvas fallback
    ctx.fillStyle=dragging?'#80ff40':'#5c9035';
    if(jawOpen){
      ctx.beginPath();ctx.arc(0,0,TILE/2,0.4,Math.PI*2-0.4);ctx.closePath();ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(0,0,TILE/2,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(TILE*0.15,-TILE*0.2,TILE*0.12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(TILE*0.18,-TILE*0.2,TILE*0.06,0,Math.PI*2);ctx.fill();
  }
  // Drag glow ring
  if(dragging){
    ctx.strokeStyle='rgba(150,255,80,0.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,TILE/2+4,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

function drawDragLine(){
  // Visual leash when dragging
  if(!dragging)return;
  const dcx=dX*TILE+TILE/2,dcy=dY*TILE+TILE/2;
  const bcx=dragging.x*TILE+TILE/2,bcy=dragging.y*TILE+TILE/2;
  ctx.save();
  ctx.strokeStyle='rgba(150,255,80,0.35)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(dcx,dcy);ctx.lineTo(bcx,bcy);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
}

function drawBook(b){
  if(b.captured){
    // Fixed slot positions inside the pen, 2x2 grid
    const slotX=[8,10,8,10][b.id];
    const slotY=[9,9,10,10][b.id];
    const cx=slotX*TILE+TILE/2,cy=slotY*TILE+TILE/2;
    ctx.save();ctx.globalAlpha=0.7;
    ctx.fillStyle=b.color;ctx.fillRect(cx-5,cy-7,10,14);
    ctx.strokeStyle='rgba(200,150,255,0.6)';ctx.lineWidth=1;ctx.strokeRect(cx-5,cy-7,10,14);
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='8px Courier New';ctx.textAlign='center';
    ctx.fillText('🔒',cx,cy+3);ctx.textAlign='left';
    ctx.restore();
    return;
  }

  // Waiting inside pen — bobbing with countdown
  if(!b.released){
    const slot=b.id; // 0-3
    const cx=(PEN_RECT.x1+1+(slot%2)*2)*TILE+TILE/2;
    const cy=(PEN_RECT.y1+1+Math.floor(slot/2))*TILE+TILE/2+Math.sin(animF*0.15+slot)*3;
    const secs=Math.ceil(b.releaseTimer/60);
    ctx.save();ctx.globalAlpha=0.55;
    // Mini book
    ctx.fillStyle=b.color;ctx.fillRect(cx-5,cy-7,10,14);
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=0.8;ctx.strokeRect(cx-5,cy-7,10,14);
    ctx.globalAlpha=1;
    // Countdown
    ctx.fillStyle='rgba(255,240,180,0.9)';ctx.font='bold 7px Courier New';ctx.textAlign='center';
    ctx.fillText(secs+'s',cx,cy+18);ctx.textAlign='left';
    ctx.restore();
    return;
  }

  const cx=b.x*TILE+TILE/2,cy=b.y*TILE+TILE/2;
  const w=TILE*0.82,h=TILE*0.96;
  const scared=b.scared&&pwrTimer>0;
  const flicker=pwrTimer>0&&pwrTimer<70&&(Math.floor(animF/6)%2===0);
  const isDragged=b===dragging;

  let col=scared?(flicker?'#ffffff':'#4455ee'):b.color;
  if(isDragged)col='#ccff88';

  ctx.save();ctx.translate(cx,cy);
  if(isDragged){ctx.shadowColor='#88ff44';ctx.shadowBlur=12;}
  else{ctx.shadowColor=scared?'#5566ff':b.color;ctx.shadowBlur=scared?8:6;}

  const L=-w/2,T=-h/2,B=h/2;
  const sc=3,sW=w/sc;

  // Book shape — clip region for logo
  ctx.beginPath();
  ctx.arc(0,T+w/2,w/2,Math.PI,0,false);
  ctx.lineTo(w/2,B);
  for(let i=sc-1;i>=0;i--)ctx.arc(L+sW*(i+0.5),B,sW/2,0,Math.PI,true);
  ctx.lineTo(L,T+w/2);ctx.closePath();

  if(!scared&&!isDragged&&imgOk(DK_LOGO)){
    // Fill base color first
    ctx.fillStyle=col;ctx.fill();
    // Clip and draw DK logo, then multiply tint with book color
    ctx.save();ctx.clip();
    ctx.drawImage(DK_LOGO,L,T,w,h);
    ctx.globalCompositeOperation='multiply';
    ctx.fillStyle=col;ctx.fillRect(L,T,w,h);
    ctx.restore();
  } else {
    ctx.fillStyle=col;ctx.fill();
  }

  // Border
  ctx.beginPath();
  ctx.arc(0,T+w/2,w/2,Math.PI,0,false);ctx.lineTo(w/2,B);
  for(let i=sc-1;i>=0;i--)ctx.arc(L+sW*(i+0.5),B,sW/2,0,Math.PI,true);
  ctx.lineTo(L,T+w/2);ctx.closePath();
  ctx.strokeStyle=scared?'#8899ff':darken(b.color,40);ctx.lineWidth=1.2;ctx.stroke();
  ctx.shadowBlur=0;

  const eyeY=T+w*0.38;
  if(!scared){
    [[-w*0.22,eyeY],[w*0.22,eyeY]].forEach(([ex,ey])=>{
      ctx.beginPath();ctx.ellipse(ex,ey,w*0.12,w*0.14,0,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fill();
      const ang=Math.atan2(dY-b.y,dX-b.x);
      const ix=ex+Math.cos(ang)*w*0.03,iy=ey+Math.sin(ang)*w*0.03;
      ctx.beginPath();ctx.ellipse(ix,iy,w*0.065,w*0.08,0,0,Math.PI*2);
      ctx.fillStyle='#1133cc';ctx.fill();
      ctx.beginPath();ctx.ellipse(ix,iy,w*0.03,w*0.04,0,0,Math.PI*2);
      ctx.fillStyle='#000';ctx.fill();
    });
    // Mouth
    const mY=T+h*0.65;
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(L+w*0.28,mY);ctx.quadraticCurveTo(0,mY-3,w/2-w*0.28,mY);ctx.stroke();
  } else {
    // Scared eyes (Xs)
    [[-w*0.22,eyeY],[w*0.22,eyeY]].forEach(([ex,ey])=>{
      ctx.strokeStyle='rgba(255,255,255,0.88)';ctx.lineWidth=1.8;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(ex-w*0.08,ey-w*0.08);ctx.lineTo(ex+w*0.08,ey+w*0.08);ctx.stroke();
      ctx.beginPath();ctx.moveTo(ex+w*0.08,ey-w*0.08);ctx.lineTo(ex-w*0.08,ey+w*0.08);ctx.stroke();
    });
    // Scared mouth wavy
    const mY=T+h*0.62;
    ctx.beginPath();ctx.moveTo(L+w*0.2,mY);
    for(let i=0;i<5;i++)ctx.lineTo(L+w*0.2+i*(w*0.6/4),mY+(i%2===0?3:-3));
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.4;ctx.stroke();
  }

  // Label in book
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.font='bold 5px Courier New';ctx.textAlign='center';
  ctx.fillText(b.label[0],0,T+h*0.48);ctx.textAlign='left';

  ctx.restore();
}

function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgbToHex([r,g,b]){return'#'+[r,g,b].map(v=>clamp(v).toString(16).padStart(2,'0')).join('');}
function darken(h,a){return rgbToHex(hexToRgb(h).map(v=>v-a));}

// ═══════════════════════════════════════════════════════
//  HUD + OVERLAY
// ═══════════════════════════════════════════════════════
function updateHUD(){
  document.getElementById('sc').textContent=score;
  document.getElementById('lf').textContent=lives;
  document.getElementById('lv').textContent=level;
  document.getElementById('bk').textContent=booksCaptured;
}

function showOverlay(title,sc){
  hideDialogue();
  const ov=document.getElementById('overlay');
  const isOver=title==='GAME OVER';
  ov.querySelector('h1').textContent=isOver?'💀 GAME OVER':'🦕 DINO-PAC';
  ov.querySelector('.sub').textContent=isOver?'The encyclopaedias won. Again.':'Haunted Library';
  const fs=document.getElementById('final-score');
  const bc=document.getElementById('books-caught');
  if(sc!==undefined){fs.style.display='block';fs.textContent='SCORE: '+sc;}else fs.style.display='none';
  if(isOver){bc.style.display='block';bc.textContent='Books captured: '+booksCaptured+' / 4 · Level '+level;}else bc.style.display='none';
  document.getElementById('btn-start').textContent=isOver?'TRY AGAIN':'CHOMP!';
  ov.classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(m[e.key]){dNext=m[e.key];e.preventDefault();}
});
['up','down','left','right'].forEach(d=>{
  const btn=document.getElementById('btn-'+d);
  btn.addEventListener('touchstart',e=>{e.preventDefault();dNext=d;},{passive:false});
  btn.addEventListener('mousedown',()=>dNext=d);
});
let tSX=0,tSY=0;
canvas.addEventListener('touchstart',e=>{tSX=e.touches[0].clientX;tSY=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tSX,dy=e.changedTouches[0].clientY-tSY;
  if(Math.abs(dx)>Math.abs(dy))dNext=dx>0?'right':'left';
  else dNext=dy>0?'down':'up';
},{passive:true});

let loopRunning=false;
document.getElementById('btn-start').addEventListener('click',()=>{
  SFX.start();
  document.getElementById('overlay').classList.add('hidden');
  hideDialogue();
  initGame();
  lastT=performance.now();
  if(!loopRunning){loopRunning=true;requestAnimationFrame(loop);}
});

// ═══════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════
function loop(ts){
  const dt=ts-lastT;lastT=ts;
  update(dt);draw();
  if(gameState==='playing')requestAnimationFrame(loop);
  else loopRunning=false;
}

// Idle draw before game starts
let idleF=0;
function idleDraw(){
  idleF++;
  if(gameState!=='playing'){
    ctx.fillStyle='#08040c';ctx.fillRect(0,0,CW,CH);
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const t=MAZE_TPL[r][c];
      if(t===1){
        const x=c*TILE,y=r*TILE;
        ctx.fillStyle='#160a2a';ctx.fillRect(x,y,TILE,TILE);
        ctx.fillStyle='#1c0e34';ctx.fillRect(x+1,y+1,TILE-2,TILE-2);
        ctx.strokeStyle='#4a20a0';ctx.lineWidth=0.8;ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
      }
      const pcx=c*TILE+TILE/2,pcy=r*TILE+TILE/2;
      if(t===2){
        ctx.save();
        ctx.shadowColor='#ffcc33';ctx.shadowBlur=5;
        ctx.fillStyle='#ffe890';
        ctx.beginPath();ctx.arc(pcx,pcy,2.5,0,Math.PI*2);ctx.fill();
        ctx.restore();
      } else if(t===3){
        const p=0.7+0.3*Math.sin(idleF*0.1);
        ctx.save();
        ctx.shadowColor='#ff44ff';ctx.shadowBlur=14;
        ctx.fillStyle='#ff88ff';
        ctx.beginPath();ctx.arc(pcx,pcy,6*p,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }
    }
  }
  requestAnimationFrame(idleDraw);
}
idleDraw();
